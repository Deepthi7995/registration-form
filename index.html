<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Style Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f0f2f5; }
    .container {
      width: 400px; margin: 50px auto; background:#fff;
      padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { text-align:center; color:#1877f2; }
    input, select { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; }
    .error { color:red; font-size:12px; margin-top:-5px; }
    button {
      width:100%; padding:10px; background:#42b72a; border:none;
      color:#fff; font-weight:bold; border-radius:5px; cursor:pointer;
    }
    button:hover { background:#36a420; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create a New Account for Facebook</h2>
    <form id="registerForm">
      <input type="text" id="fname" placeholder="First name">
      <div class="error" id="fnameError"></div>
      
      <input type="text" id="lname" placeholder="Last name">
      <div class="error" id="lnameError"></div>

      <input type="email" id="email" placeholder="Mobile number or email">
      <div class="error" id="emailError"></div>

      <input type="password" id="password" placeholder="New password">
      <div class="error" id="passwordError"></div>

      <label for="dob">Date of birth:</label>
      <input type="date" id="dob">
      <div class="error" id="dobError"></div>

      <label>Gender:</label>
      <select id="gender">
        <option value="">Select gender</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Other">Other</option>
      </select>
      <div class="error" id="genderError"></div>

      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(e){
      e.preventDefault(); // stop form submit
      let valid = true;

      // First name
      const fname = document.getElementById("fname").value.trim();
      if(fname === ""){
        document.getElementById("fnameError").innerText = "First name is required";
        valid = false;
      } else {
        document.getElementById("fnameError").innerText = "";
      }

      // Last name
      const lname = document.getElementById("lname").value.trim();
      if(lname === ""){
        document.getElementById("lnameError").innerText = "Last name is required";
        valid = false;
      } else {
        document.getElementById("lnameError").innerText = "";
      }

      // Email/Phone
      const email = document.getElementById("email").value.trim();
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      const phonePattern = /^[0-9]{10}$/;
      if(email === "" || (!emailPattern.test(email) && !phonePattern.test(email))){
        document.getElementById("emailError").innerText = "Enter valid email or 10-digit phone";
        valid = false;
      } else {
        document.getElementById("emailError").innerText = "";
      }

      // Password
      const password = document.getElementById("password").value;
      if(password.length < 6){
        document.getElementById("passwordError").innerText = "Password must be at least 6 characters";
        valid = false;
      } else {
        document.getElementById("passwordError").innerText = "";
      }

      // DOB
      const dob = document.getElementById("dob").value;
      if(dob === ""){
        document.getElementById("dobError").innerText = "Date of birth is required";
        valid = false;
      } else {
        document.getElementById("dobError").innerText = "";
      }

      // Gender
      const gender = document.getElementById("gender").value;
      if(gender === ""){
        document.getElementById("genderError").innerText = "Please select gender";
        valid = false;
      } else {
        document.getElementById("genderError").innerText = "";
      }

      if(valid){
        alert("✅ Registration Successful!");
        // here you can submit to backend server using fetch/ajax
      }
    });
  </script>
</body>
</html>
